[project]
name = "hacs-spc-vanderbilt"
version = "1.0.0rc1"
description = "Vanderbilt SPC sensors and alarm controls for Home Assistant"
requires-python = ">=3.14.2"
dependencies = [
    "spcedp@git+https://github.com/imduffy15/spcedp.git@88942f12d6450d70e2d448afc4f4ebfc2f983795",
]

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.366",
    "ruff>=0.15", "pylint>=4", "mypy>=2", "bandit[toml]>=1.8",
]

[tool.uv]
package = false
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["custom_components/spc_edp"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "DTZ", "T10", "PIE"]

[tool.pylint.main]
py-version = "3.14"

[tool.pylint.design]
max-returns = 9  # Each panel rejection code gets a specific user-facing message.

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "missing-function-docstring", "missing-class-docstring", "too-few-public-methods",
    "too-many-instance-attributes", "too-many-public-methods", "duplicate-code",
]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/spc_edp", "scripts"]
strict = true
follow_imports = "silent"

[tool.bandit]
# Internal assertions enforce programmer invariants; no input validation relies on them.
skips = ["B101"]
